<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Assets/style.css">
    <link rel="shortcut icon" href="../Assets/Tabicon.png" type="image/x-icon">
    <link rel="stylesheet" href="../downloads/style.css">
    <link rel="stylesheet" href="style.css">
    <title>Curloads - Mix Maker</title>
</head>
<body>
    <div id="head">
        <a href="../"><img src="../../Assets/icons/home.svg" alt=""></a>
        <h1>Cursor Mix Maker</h1>
    </div>
    <div class="block" id="block">
        <div class="container" id="cursor-mixer">
            <div>
                <div class="block">
                    <img src="" alt="" id="mouse-img">
                    <select id="mouse-sel">
                        <option value="">Pick A Mouse Cursor</option>
                    </select>
                </div>
                <p>Mouse</p>
            </div>
            <div>
                <div class="block">
                    <img src="" alt="" id="select-img">
                    <select name="" id="select-sel">
                        <option value="">Pick A Select Cursor</option>
                    </select>
                </div>
                <p>Select</p>
            </div>
            <div>
                <div class="block">
                    <img src="" alt="" id="busy-img">
                    <select name="" id="busy-sel">
                        <option value="">Pick A Busy Cursor</option>
                    </select>
                </div>
                <p>Busy</p>
            </div>
            <div>
                <div class="block">
                    <img src="" alt="" id="text-img">
                    <select name="" id="text-sel">
                        <option value="">Pick A Text Cursor</option>
                    </select>
                </div>
                <p>Text</p>
            </div>
            <div>
                <div class="block">
                    <img src="" alt="" id="wib-img">
                    <select name="" id="wib-sel">
                        <option value="">Pick A Work In Background Cursor</option>
                    </select>
                </div>
                <p>Work In Background</p>
            </div>
        </div>
        <button id="mix-download">Download Mix</button>
    </div>

    <script type="module" src="mixer.js"></script>
</body>
</html>
